<div class="auth-page-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-4 col-lg-5 col-md-7">
                <div class="card auth-card">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <a href="/admin" class="d-inline-block auth-logo">
                                <img src="/admin/assets/images/logo-dark.png" alt="Devmart Admin" height="32" class="logo-dark">
                                <img src="/admin/assets/images/logo-light.png" alt="Devmart Admin" height="32" class="logo-light">
                            </a>
                            <h4 class="fw-semibold mt-4 mb-1">Sign In</h4>
                            <p class="text-muted mb-0">Sign in to continue to Devmart Admin.</p>
                        </div>

                        <form action="/admin" method="get">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email">
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="password" class="form-label mb-0">Password</label>
                                    <a href="#" class="text-muted small">Forgot password?</a>
                                </div>
                                <input type="password" class="form-control mt-1" id="password" placeholder="Enter your password" autocomplete="current-password">
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="remember-me">
                                <label class="form-check-label" for="remember-me">Remember me</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Sign In</button>
                            </div>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0 small">
                            Devmart Admin &middot; Static demo &mdash; no authentication is performed.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
